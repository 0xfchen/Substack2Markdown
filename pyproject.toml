[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "substack2markdown"
version = "0.1.0"
description = "Scrape and archive Substack newsletters into Markdown and HTML formats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Tim Farrelly" },
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "bs4>=0.0.1",
    "html2text>=2020.1.16",
    "markdown>=3.6",
    "requests>=2.31.0",
    "selenium>=4.16.0",
    "tqdm>=4.66.1",
    "webdriver-manager>=4.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
substack2markdown = "substack_scraper:main"
substack_scraper = "substack_scraper:main"

[tool.setuptools]
packages = ["substack_scraper"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
