<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Substack Reader">
  <defs>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="poly-line-b" x1="30" y1="41" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="polaris-gold" x1="40" y1="10" x2="52" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#tile-bg)" stroke="#e2e8f0" stroke-width="1.2"/>
  
  <!-- Constellation Links -->
  <polyline points="16,46 25,48 30,41 21,39 16,46" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,41 36,34 40,26 46,18" fill="none" stroke="url(#poly-line-b)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 1. Violet -->
  <circle cx="16" cy="46" r="2.5" fill="#a855f7"/>
  <!-- 2. Indigo -->
  <circle cx="25" cy="48" r="2.5" fill="#6366f1"/>
  <!-- 3. Blue -->
  <circle cx="21" cy="39" r="2.4" fill="#2563eb"/>
  <!-- 4. Cyan -->
  <circle cx="30" cy="41" r="2.6" fill="#06b6d4"/>
  <!-- 5. Green -->
  <circle cx="36" cy="34" r="2.5" fill="#10b981"/>
  <!-- 6. Orange / Crimson -->
  <circle cx="40" cy="26" r="2.7" fill="#f97316"/>
  <!-- 7. Radiant Gold North Star (Polaris) -->
  <path d="M46 9 C46 14.5 47.5 17 53 18 C47.5 19 46 21.5 46 27 C46 21.5 44.5 19 39 18 C44.5 17 46 14.5 46 9 Z" fill="url(#polaris-gold)"/>
  <circle cx="46" cy="18" r="1.6" fill="#ffffff"/>
</svg>
